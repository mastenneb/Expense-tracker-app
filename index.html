<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, intial-scale=1.0">
    <meta name="description" content="Expense tracker by mn dev Made with love and kindness">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Masten Neb">
    <meta name="keywords" content="Expense tracker, Mn dev, expense tracker by mn dev">
    <meta property="og:title" content="Expense tracker App">
    <meta property="og:description" content="EXpense tarcker by mn dev made with love by mn dev">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://expensetracker.app">
    <meta property="og:image" content="https://imageserver200/expsense.jpg">
    <title>EXPENSE TRACKER APP BY MN DEV</title>
    <link rel="icon" type="image/x-icon" href="">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Expense Tracker App</h1>
    <div class="container">
      <!-- WHERE THE BALANCE SHOWS AND OTHER IMPORTANT INFO TO DISPLAY -->
      <div class="balanceContainer">
        <h2>TOTAL BALANCE</h2>
        <h2><span id="totalBalance"></span></h2>
        <div class="shortMenuBox">
          <div class="incomeBox">
            <h3>INCOME</h3>
            <h4><span id="income"></span></h4>
          </div>
          <div class="ExpenseBox">
            <h3>EXPENSE</h3>
            <h4><span id="expense"></span></h4>
          </div>
        </div>
      </div>
      <!-- Where to add transaction to the balance and remove money -->
      <div class="transactionBox">
        <h2>Add a transaction</h2>
        <div class="classificationBox">
          <div class="income">INCOME</div>
          <div class="expense">EXPENSE</div>
        </div>
        <form id="form">
          <div class="grp">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="e.g data Bundle, salary">
          </div>
          <div class="grp">
            <label for="amount">Amount($)</label>
            <input type="number" id="amount" placeholder="0.00">
          </div>
          <div class="grp">
            <label for="date">Date</label>
            <input type="date" id="date">
          </div>
          <div class="grp">
            <button type="submit">Add transaction</button>
          </div>
        </form>
      </div>
      <!-- TRANSACTION HISTORY BOX -->
      <div class="transactHistoryBox">
        <div class="heading">
          <h3>Transaction History</h3>
          <h3><span id="numOftransactions"></span> transactions</h3>
        </div>
        <div class="containerForTransactions">
          
        </div>
      </div>
    </div>
    <script src="main.js" defer></script>
  </body>
</html>
